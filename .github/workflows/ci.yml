name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - run: go build ./...
      - run: go test ./...

  integration:
    name: integration (ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Install ffmpeg + build deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake build-essential
      # mp4v2 is not in apt (upstream abandoned); build the enzo1982
      # maintained fork from source. See spec/external-tools.md.
      - name: Build and install mp4v2
        run: |
          git clone --depth 1 https://github.com/enzo1982/mp4v2.git /tmp/mp4v2-src
          cmake -S /tmp/mp4v2-src -B /tmp/mp4v2-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/mp4v2-build -j"$(nproc)"
          sudo cmake --install /tmp/mp4v2-build
          sudo ldconfig
      - run: go test -tags=integration ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1
