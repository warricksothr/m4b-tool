# Release-only workflow: builds the runtime container image from
# Containerfile and pushes it to GitHub Container Registry. Lives only
# on the `release` branch (see .release-only); never runs against
# `main`. Triggered by every push to `release` (i.e. each curated
# release commit) plus manual dispatch from the Actions UI.
#
# Tags pushed:
#   - :latest         → moves with each release commit
#   - :sha-<short>    → immutable, per-commit reference
#
# When tags eventually start reaching the public mirror, add another
# `type=semver` line under tags: in docker_meta and remove the gating
# notice from the README's container section.

name: build-and-publish-image

on:
  push:
    branches: [release]
  workflow_dispatch:

# Single-flight: if a second release commit lands while one is
# building, queue it rather than racing — cache reuse is more useful
# than parallelism here, and pushing two `:latest`s simultaneously is
# a recipe for confusion.
concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # → warricksothr/m4b-tool

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=m4b-tool
            org.opencontainers.image.description=Go CLI for managing audiobook .m4b files
            org.opencontainers.image.licenses=MIT

      - name: Compute build-arg metadata
        id: build_args
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "version=release-${short}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image into the local Docker daemon so we can smoke
      # test it before publishing. Single-platform amd64 makes
      # `load: true` straightforward. The mp4v2 stage is the slow part
      # (compiles from source); GHA cache makes the second build below
      # essentially a cache hit for every layer.
      - name: Build (local load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: m4b-tool:smoketest
          build-args: |
            VERSION=${{ steps.build_args.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build_args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `m4b-tool doctor` checks that ffmpeg + mp4v2 utilities are
      # present and runnable, exiting non-zero if anything's missing.
      # If this fails, the broken image never reaches GHCR.
      - name: Smoke test
        run: docker run --rm m4b-tool:smoketest doctor

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_args.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build_args.outputs.date }}
          # Cache from the smoke-test build above: every layer is
          # already built, so this step is essentially "rewrite the
          # manifest and push."
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + provenance attestations: lets downstream consumers
          # (and security scanners) inspect what's in the image.
          sbom: true
          provenance: true
